<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Database Wiki</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="wiki-container">
        <aside class="sidebar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search the wiki...">
            </div>
            <ul id="navigationList" class="nav-list">
                <!-- Navigation links will be auto-generated here -->
            </ul>
        </aside>
        
        <main class="content" id="mainContent">
            <h1>Welcome to the Wiki</h1>
            <p>Select an item from the sidebar to view its details. The database is generated entirely from the game's raw data.</p>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
